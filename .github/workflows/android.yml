name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - name: Build web app and sync into the Android project
        run: |
          npm run build
          npx cap sync android
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug and release APKs
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Verify signatures and name the APKs
        run: |
          BT="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)"
          OUT=android/app/build/outputs/apk
          "${BT}apksigner" verify --print-certs "$OUT/release/app-release.apk"
          "${BT}apksigner" verify --print-certs "$OUT/debug/app-debug.apk"
          mkdir apks
          cp "$OUT/release/app-release.apk" apks/Ma-Journee-Rosee-release.apk
          cp "$OUT/debug/app-debug.apk" apks/Ma-Journee-Rosee-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ma-Journee-Rosee-apks
          path: apks/*.apk
      - name: Publish a GitHub release with the APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" apks/*.apk --target "$GITHUB_SHA" --latest \
            --title "Ma Journée Rosée $TAG" \
            --notes "APK Android : **release** (recommandé, optimisé) et **debug**. Télécharge un fichier .apk sur le téléphone et installe-le (autoriser les sources inconnues). Les deux sont signés avec la même clé : tu peux passer de l'un à l'autre en les installant par-dessus."
